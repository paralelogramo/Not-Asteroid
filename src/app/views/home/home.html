<div class="relative flex flex-col w-full h-full opacity-100 select-none home-view">
    <div class="absolute inset-0 z-0 opacity-50 blur-[1px]" id="stars-container"></div>

    <div class="absolute top-[45%] left-1/2 -translate-y-1/2 -translate-x-1/2 whitespace-nowrap flex flex-col justify-center items-center z-10 fade-and-move-up animation-delay-3 opacity-0 perspective-midrange">
        <h1 class="font-audiowide text-[15vh] text-slate-100 text-centers rotate-x-[12deg] origin-bottom text-glow">
            N0t-AsTeRoIdS.JS
        </h1>
    </div>

    <div class="absolute bottom-[15%] left-1/2 -translate-1/2 flex flex-row gap-12 w-1/3 justify-center items-center">
        <button id="play-btn" class="font-audiowide w-2/5 text-white text-[2vh] px-12 py-3 rounded-3xl border-2 border-slate-100 bg-slate-900 bg-opacity-40 backdrop-blur-sm fade-and-move-up animation-delay-6 opacity-0 cursor-pointer
            shadow-[0_0_20px_rgba(255,255,255,0.2)]
            transition-all duration-300 ease-in-out
            hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.4)]
            disabled:pointer-events-none disabled:cursor-default" (click)="clickPlay()"
            [disabled]="disabledButtons">
            PLAY
        </button>

        <button id="credit-btn" class="font-audiowide w-2/5 text-white text-[2vh] px-12 py-3 rounded-3xl border-2 border-slate-100 bg-slate-900 bg-opacity-40 backdrop-blur-sm fade-and-move-up animation-delay-6 opacity-0 cursor-pointer
            shadow-[0_0_20px_rgba(255,255,255,0.2)]
            transition-all duration-300 ease-in-out
            hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.4)]
            active:scale-95 active:shadow-[0_0_15px_rgba(255,255,255,0.6)]
            disabled:pointer-events-none disabled:cursor-default" (click)="clickCredits()"
            [disabled]="disabledButtons">
            CREDITS
        </button>
    </div>

    <div class="absolute top-12 left-12 w-fit flex flex-row h-fit justify-start items-center rounded-3xl z-20 box-glow overflow-hidden fade-and-move-up animation-delay-7.5 opacity-0">
        <button class="relative flex items-center justify-center px-6 py-3 transition duration-500 rounded-l-2xl group hover:cursor-pointer disabled:cursor-default disabled:pointer-events-none" [disabled]="disabledButtons">
            <div class="absolute top-0 left-0 w-full h-full transition-opacity duration-500 opacity-0 bg-gradient-to-r from-slate-700 via-slate-700 to-transparent group-hover:opacity-100 -z-10"></div>
            <ng-icon name="boxLinkedinLogo" color="#f1f5f9" size="4.5vh" class="transition group-hover:scale-110"></ng-icon>
        </button>

        <button class="relative flex items-center justify-center px-6 py-3 transition duration-500 rounded-r-2xl group hover:cursor-pointer disabled:cursor-default disabled:pointer-events-none" [disabled]="disabledButtons">
            <div class="absolute top-0 left-0 w-full h-full transition-opacity duration-500 opacity-0 bg-gradient-to-l from-slate-700 via-slate-700 to-transparent group-hover:opacity-100 -z-10"></div>
            <ng-icon name="boxGithubLogo" color="#f1f5f9" size="4.5vh" class="transition group-hover:scale-110"></ng-icon>
        </button>
    </div>
</div>
