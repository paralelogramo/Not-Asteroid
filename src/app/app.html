<div class="relative w-screen h-screen overflow-hidden bg-slate-900">
    <div class="absolute inset-0 z-0 opacity-50 blur-[1px]" id="stars-container"></div>
    
    @switch (currentView) {
        @case ("home") {
            <app-home (selectedOption)="handleSelectedOption($event)"></app-home>
        }
        @case ("credit") {
            <app-credit (backHandler)="handleSelectedOption($event)"></app-credit>
        }
        @case ("game") {
            <app-game></app-game>
        }
    }
</div>
